name: narracao
on: [push, workflow_dispatch]
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install edge-tts faster-whisper
      - run: python gen.py
      - uses: actions/upload-artifact@v4
        with:
          name: vo
          path: out/
